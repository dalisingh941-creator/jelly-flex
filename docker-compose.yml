version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: jellyflex-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - JELLYFLEX_MASTER_PEPPER=${JELLYFLEX_MASTER_PEPPER:-jellyflex-docker-pepper}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      - jellyflex_data:/app/backend/database
      - ./skills:/app/skills:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: jellyflex-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000

volumes:
  jellyflex_data:
